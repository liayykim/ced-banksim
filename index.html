<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bank of Career Ed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bank">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E7EBFB">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
@font-face{font-family:'Comic Neue';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/comic-neue-400.woff2) format('woff2')}
@font-face{font-family:'Comic Neue';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/comic-neue-700.woff2) format('woff2')}
</style>
<style>
/* Layout: iPad kiosk. Big touch targets, one clear job per screen, everything visual (no sound).
   Palette: ink navy, bank blue, savings teal, signal gold for the one main action, green/red for money in/out. */
:root{
  --bg:#E7EBFB; --surface:#FFFFFF; --ink:#001266; --muted:#3B4A9E; --line:#BFC8F2;
  --blue:#0024CC; --teal:#001266; --on-color:#FFFFFF;
  --gold:#0024CC; --on-gold:#FFFFFF;
  --in:#0B7A4B; --in-soft:#E1F3E9; --out:#B42318; --out-soft:#FCE7E4;
  --focus:#E67E00; --shadow:0 1px 2px rgba(16,36,58,.08),0 6px 18px rgba(16,36,58,.06);
  --font-display:'Comic Sans MS','Comic Sans','Comic Neue','Chalkboard SE',cursive,sans-serif;
  --font-body:'Comic Sans MS','Comic Sans','Comic Neue','Chalkboard SE',cursive,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#00103D; --surface:#0A1C6B; --ink:#E8ECFF; --muted:#B3BFF0; --line:#2A3FA8;
    --blue:#2F4FE6; --teal:#1A2EB0; --gold:#2F4FE6; --on-gold:#FFFFFF;
    --in:#55D395; --in-soft:#123B2A; --out:#FF9288; --out-soft:#45201D;
    --focus:#FFB84D; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#00103D; --surface:#0A1C6B; --ink:#E8ECFF; --muted:#B3BFF0; --line:#2A3FA8;
  --blue:#2F4FE6; --teal:#1A2EB0; --gold:#2F4FE6; --on-gold:#FFFFFF;
  --in:#55D395; --in-soft:#123B2A; --out:#FF9288; --out-soft:#45201D;
  --focus:#FFB84D; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:20px;line-height:1.4;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 32px;min-height:100vh;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:800;font-size:1.35rem;color:var(--blue)}
:root[data-theme="dark"] .logo{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:var(--ink)}}
.logo svg{width:44px;height:44px;flex:none}
.logo img{height:64px;width:auto;max-width:100%}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.who b{font-family:var(--font-display);font-size:1.2rem}
.btn{min-height:64px;padding:12px 26px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:transparent;font-size:1.15rem}
.btn.line{border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:26px;height:26px;flex:none}

/* start */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding-block:24px}
.start .logo{font-size:2rem}
.start .logo svg{width:72px;height:72px}
.start .logo img{height:clamp(160px,32vh,260px)}
.tap{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800}
.cue{width:min(420px,90%)}
.cue svg{width:100%;height:auto;display:block}
.ring{transform-origin:300px 130px;animation:pulse 2.4s ease-out infinite;opacity:0}
.ring.r2{animation-delay:.8s}.ring.r3{animation-delay:1.6s}
.card-ico{animation:slide 2.4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes slide{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,0)}}
@media (prefers-reduced-motion: reduce){.ring,.card-ico{animation:none}.ring{opacity:.35}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:8px}

/* welcome / messages */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.big{font-size:clamp(3rem,10vw,6rem);font-weight:800;color:var(--blue)}
:root[data-theme="dark"] .big{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big{color:var(--ink)}}
.name{font-size:1.8rem;font-family:var(--font-display);font-weight:700}
.dots{display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--blue);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i{animation:none}}
.note{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 22px;max-width:620px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 8px;border-radius:6px}

/* home */
h2.title{font-size:1.9rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:0;border-radius:20px;padding:24px 26px;color:var(--on-color);box-shadow:var(--shadow);min-height:170px;min-width:0}
.tile.checking{background:var(--blue)}.tile.savings{background:var(--teal)}
.tile .lbl{font-weight:700;font-size:1.2rem;opacity:.95}
.tile .amt{font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.05}
.tile .hint{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:700;opacity:.95}
.tile .hint svg{width:22px;height:22px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.action{min-height:96px;border-radius:20px;border:0;background:var(--gold);color:var(--on-gold);font-family:var(--font-display);font-weight:800;font-size:1.6rem;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:var(--shadow)}
.action svg{width:40px;height:40px}

/* detail */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .bal{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,6vw,3rem)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.sub{display:block;font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:999px;margin-right:8px}
.in{color:var(--in)}.out{color:var(--out)}
.tag.in{background:var(--in-soft)}.tag.out{background:var(--out-soft)}
.empty{padding:26px 6px;color:var(--muted);text-align:center}
.pill{display:inline-block;background:var(--in-soft);color:var(--in);font-weight:700;padding:6px 14px;border-radius:999px;font-size:.95rem}

/* pay / bills */
.bills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.bill{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;min-height:128px;min-width:0}
.bill .n{font-family:var(--font-display);font-weight:800;font-size:1.35rem}
.bill .a{font-size:1.7rem;font-weight:700}
.bill .l{font-size:.85rem;color:var(--muted);margin-top:auto}
.bill[disabled]{opacity:.55;cursor:not-allowed}
.groc{grid-column:1/-1;cursor:default}
.groc .row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;width:100%;margin-top:6px}
.groc .field{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:14px;padding:0 16px;background:var(--bg);flex:1 1 200px;min-height:64px}
.groc input{font:inherit;font-size:1.6rem;font-weight:700;border:0;background:none;color:var(--ink);width:100%;outline:none;min-width:0}
.groc .field:focus-within{outline:4px solid var(--focus);outline-offset:3px}
.err{color:var(--out);font-weight:700}
.math{display:grid;grid-template-columns:1fr auto;gap:8px 20px;font-size:1.3rem;max-width:520px;margin:6px auto 0;text-align:left}
.math .tot{border-top:2px solid var(--ink);padding-top:10px;font-weight:700}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* idle */
#idle{position:fixed;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--gold);color:var(--on-gold);font-weight:700;text-align:center;z-index:20}
/* teacher */
.btn.small{min-height:48px;padding:6px 16px;font-size:.9rem;border-radius:12px}
.form{display:grid;gap:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.fld>label{font-weight:700}
select,input[type=text],input[type=datetime-local]{font:inherit;font-size:1.1rem;min-height:56px;border:2px solid var(--ink);border-radius:12px;padding:0 14px;background:var(--bg);color:var(--ink);max-width:100%;min-width:0}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:0 14px;background:var(--bg);min-height:56px}
.money input{border:0;padding:0;min-height:52px;width:100%;background:none;outline:none;font-size:1.3rem;font-weight:700}
.money:focus-within{outline:4px solid var(--focus);outline-offset:3px}
.crow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px}
.chk{display:flex;gap:12px;align-items:center;font-weight:700;flex:1 1 180px;min-width:0}
.chk input{width:28px;height:28px;accent-color:var(--blue);flex:none}
.when{flex:1 1 280px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.keypad{display:grid;grid-template-columns:repeat(3,92px);gap:12px;justify-content:center}
.key{height:80px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:800;font-size:1.8rem;box-shadow:var(--shadow)}
.pdots{display:flex;gap:16px;justify-content:center}
.pdots i{width:24px;height:24px;border-radius:50%;border:3px solid var(--blue)}
.pdots i.on{background:var(--blue)}
.ok{color:var(--in);font-weight:700}
.tag.sch{background:var(--line);color:var(--ink)}
.tag.act{background:var(--in-soft);color:var(--in)}
/* late bills */
.bill.late{border-color:var(--out);background:var(--out-soft)}
.latetag{display:inline-flex;align-items:center;gap:6px;margin-left:12px;color:var(--out);font-weight:800;font-size:.9rem;letter-spacing:.04em;vertical-align:middle}
.latetag svg{width:24px;height:24px;flex:none}
.lbadge{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#B42318;border-radius:999px;padding:4px 12px;font-family:var(--font-body);font-size:.85rem;font-weight:700}
.lbadge svg{width:20px;height:20px}
.bigwarn svg{width:120px;height:120px;color:var(--out)}
/* transfer */
.xfer{min-height:72px;border-radius:18px;border:3px solid var(--blue);background:var(--surface);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:1.4rem;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.xfer svg{width:32px;height:32px}
/* no class days calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.mon h3{margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .wh{text-align:center;font-size:.8rem;color:var(--muted);padding:2px 0}
.nd{position:relative;min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.nd i{font-style:normal;font-size:.7rem;font-weight:800}
.nd.on{background:var(--out-soft);border:3px solid var(--out);color:var(--out)}
.nd.on i{font-size:1rem}
.nd.lock{background:var(--bg);border:2px dashed var(--out);color:var(--out);cursor:not-allowed}
.nd.off{opacity:.35;cursor:not-allowed}
</style>

<body>
<div id="app" class="wrap"></div>
<div id="idle" hidden></div>
<script>
/* On-device database. Gives the bank the same calls it used with Claude's online database,
   but everything is kept in this browser's own storage (IndexedDB). Nothing is sent anywhere. */
var LocalDB=(function(){
  var COLS=["students","tx","jobs","billAssignments","settings"];
  var KEY="bank-of-career-ed", state={cols:{},meta:{}}, mode="memory", idb=null, chain=Promise.resolve();
  function blank(){COLS.forEach(function(c){if(!state.cols[c])state.cols[c]={};});}
  function clone(x){return x===undefined?x:JSON.parse(JSON.stringify(x));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
  function isObj(x){return x!==null&&typeof x==="object"&&!Array.isArray(x);}
  function openIDB(){return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error("no indexedDB"));
    var r=indexedDB.open(KEY,1);
    r.onupgradeneeded=function(){r.result.createObjectStore("kv");};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error||new Error("idb error"));};
    r.onblocked=function(){rej(new Error("idb blocked"));};
  });}
  function idbRead(){return new Promise(function(res,rej){
    var q=idb.transaction("kv","readonly").objectStore("kv").get("state");
    q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
  function idbWrite(str){return new Promise(function(res,rej){
    var t=idb.transaction("kv","readwrite");t.objectStore("kv").put(str,"state");
    t.oncomplete=function(){res();};t.onerror=function(){rej(t.error||new Error("write failed"));};t.onabort=function(){rej(t.error||new Error("write aborted"));};});}
  function load(str){var o=JSON.parse(str);if(isObj(o)&&isObj(o.cols)){state.cols=o.cols;state.meta=isObj(o.meta)?o.meta:{};}blank();}
  function write(){
    var str=JSON.stringify(state);
    if(mode==="indexeddb")return idbWrite(str);
    if(mode==="localstorage"){localStorage.setItem(KEY,str);return Promise.resolve();}
    return Promise.resolve();
  }
  function persist(){var p=chain.then(write);chain=p.catch(function(){});return p;}
  function docRef(path){
    var i=path.indexOf("/"), c=path.slice(0,i), id=path.slice(i+1);
    return {
      get:function(){var d=state.cols[c]&&state.cols[c][id];return Promise.resolve({exists:d!==undefined,data:function(){return clone(d);}});},
      set:function(d){state.cols[c][id]=clone(d);return persist();},
      update:function(p){if(state.cols[c][id]===undefined)return Promise.reject(new Error("not found"));Object.assign(state.cols[c][id],clone(p));return persist();},
      "delete":function(){delete state.cols[c][id];return persist();}
    };
  }
  function colRef(c,filters){
    return {
      where:function(f,op,v){if(op!=="==")throw new Error("unsupported");return colRef(c,(filters||[]).concat([[f,v]]));},
      get:function(){
        var out=[];
        Object.keys(state.cols[c]).forEach(function(id){
          var d=state.cols[c][id];
          if((filters||[]).every(function(x){return d[x[0]]===x[1];}))out.push({id:id,data:function(){return clone(d);}});
        });
        return Promise.resolve({docs:out});
      },
      add:function(d){var id=uid();state.cols[c][id]=clone(d);return persist().then(function(){return {id:id};});}
    };
  }
  var api={
    doc:docRef, collection:function(c){return colRef(c);},
    getMeta:function(k){return state.meta[k];},
    setMeta:function(k,v){state.meta[k]=v;return persist();},
    counts:function(){return {students:Object.keys(state.cols.students).length,tx:Object.keys(state.cols.tx).length};},
    hasData:function(){return Object.keys(state.cols.students).length>0;},
    snapshot:function(){
      return {format:"bank-of-career-ed-backup",version:1,madeAt:Date.now(),
        counts:{students:Object.keys(state.cols.students).length,tx:Object.keys(state.cols.tx).length},data:clone(state.cols)};
    },
    checkBackup:function(o){
      if(!isObj(o)||o.format!=="bank-of-career-ed-backup"||!isObj(o.data))return "That is not a Bank of Career Ed backup file.";
      if(typeof o.version!=="number"||o.version>1)return "This backup was made by a newer version of the bank. Update the bank first, then try again.";
      for(var i=0;i<COLS.length;i++){
        var c=o.data[COLS[i]];
        if(c===undefined)continue;
        if(!isObj(c))return "This backup file is damaged.";
        var ks=Object.keys(c);
        for(var j=0;j<ks.length;j++)if(!isObj(c[ks[j]]))return "This backup file is damaged.";
      }
      if(!isObj(o.data.students)||!isObj(o.data.tx))return "This backup file is damaged.";
      return "";
    },
    restoreFrom:function(snap){
      var prevCols=state.cols, prevMeta=state.meta;
      var cols={};COLS.forEach(function(c){cols[c]=clone(snap.data[c])||{};});
      state.cols=cols;state.meta=Object.assign({},prevMeta,{lastBackup:snap.madeAt||Date.now()});
      return persist().catch(function(e){state.cols=prevCols;state.meta=prevMeta;throw e;});
    }
  };
  return {
    open:async function(){
      blank();
      try{
        idb=await openIDB();mode="indexeddb";
        var raw=await idbRead();if(raw)load(raw);
      }catch(e){
        idb=null;
        try{
          var raw2=localStorage.getItem(KEY);localStorage.setItem(KEY+".probe","1");localStorage.removeItem(KEY+".probe");
          mode="localstorage";if(raw2)load(raw2);
        }catch(e2){mode="memory";}
      }
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e3){}
      api.mode=mode;
      return api;
    }
  };
})();
</script>
<script>
(function(){
"use strict";
var DAY=86400000, WEEK=7*DAY, RATE=0.03, FEE_MIN=10000, FEE_AMT=1500, START_CENTS=10000;
var BILLS=[["rent","Rent"],["utilities","Utilities"],["transportation","Transportation"],["healthcare","Healthcare"],["groceries","Groceries"]];
var LEGACY=[["electricity","Electricity"],["gas","Gas"],["insurance","Insurance"],["internet","Internet"]];
var OTHER=["other","Other"];
var HOUSE=["housing","Housing"];
/* homes 1 (cheapest) to 5. weekly cents = one quarter of the monthly figure: [id, label, weekly rent, weekly utilities] */
var HOUSING=[["h1","1",12500,2500],["h2","2",18750,5000],["h3","3",25000,7500],["h4","4",31250,10000],["h5","5",37500,12500]];
/* health plans: [id, label, weekly premium cents] */

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(c){var n=Math.abs(c)/100;return (c<0?"-":"")+"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function dShort(t){return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function dTime(t){return new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}
function dDay(t){return new Date(t).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});}
function dLong(t){return new Date(t).toLocaleString("en-US",{weekday:"long",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function parseMoney(s){s=String(s||"").replace(/[$,\s]/g,"");if(!/^\d+(\.\d{1,2})?$/.test(s))return null;return Math.round(parseFloat(s)*100);}
function keyOf(code){return code.replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function bal(txs,acct,upTo){var t=0;for(var i=0;i<txs.length;i++){var x=txs[i];if(x.acct===acct&&x.ts<=(upTo==null?Infinity:upTo))t+=x.amt;}return t;}

/* ---------- class days and no class days ---------- */
/* A class meets on the weekdays checked in Classes (default Mon to Fri). Days checked in No Class Days are skipped.
   A bill or paycheck that lands on a day the class does not meet moves to the next day it does meet at 8:00 AM,
   and every later week stays on a 7 day cycle from that new day. */
function dkey(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function classDays(cid){var c=S.classes.filter(function(x){return x.id===cid;})[0];return c&&c.days&&c.days.length?c.days:[1,2,3,4,5];}
function noClassOn(key,cid){var n=S.noClass||{};return !!((n.all&&n.all[key])||(n.cls&&n.cls[cid]&&n.cls[cid][key]));}
function bumpDay(t,cid){
  var d=new Date(t);d.setHours(8,0,0,0);var first=d.getTime();
  if(!cid)return first;
  var days=classDays(cid);
  for(var i=0;i<400;i++){
    if(days.indexOf(d.getDay())>-1&&!noClassOn(dkey(d),cid))return d.getTime();
    d.setDate(d.getDate()+1);d.setHours(8,0,0,0);
  }
  return first;
}
function payAt(t,k,cid){
  if(!cid){var d0=new Date(t);d0.setDate(d0.getDate()+7*k);d0.setHours(8,0,0,0);return d0.getTime();}
  var cur=bumpDay(t,cid);
  for(var i=0;i<k;i++){var d=new Date(cur);d.setDate(d.getDate()+7);cur=bumpDay(d.getTime(),cid);}
  return cur;
}
/* each job pays every 7 days from its first paycheck date; a newer job replaces it from its own start date */
function payPlan(){
  var now=Date.now(), claimed={}, cid=S.student&&S.student.classId, list=S.jobs.slice().sort(function(a,b){return a.startAt-b.startAt;});
  S.tx.forEach(function(t){if(t.kind==="pay"&&t.meta&&t.meta.aid)claimed[t.meta.aid+":"+t.meta.k]=1;});
  var waiting=[], next=0, cur=null;
  list.forEach(function(a,i){
    var end=list[i+1]?payAt(list[i+1].startAt,0,cid):Infinity;
    if(payAt(a.startAt,0,cid)<=now)cur=a;
    for(var k=0;k<520;k++){
      var at=payAt(a.startAt,k,cid);
      if(at>=end)break;
      if(at>now){if(!next||at<next)next=at;break;}
      if(!claimed[a.id+":"+k])waiting.push({a:a,k:k,at:at});
    }
  });
  return {cur:cur,waiting:waiting,next:next};
}
function lastPay(){var m=0;S.tx.forEach(function(t){if(t.kind==="pay"&&t.ts>m)m=t.ts;});return m;}
function vPaid(){
  var p=payPlan(), cur=p.cur, wk=cur?cur.payCents:0, lp=lastPay(), total=0, n=p.waiting.length, body;
  p.waiting.forEach(function(w){total+=w.a.payCents;});
  if(!cur&&!p.next)body='<div class="note">You do not have a job yet. Ask your teacher.</div>';
  else if(!cur)body='<div class="note">Your job starts <b>'+esc(dDay(p.next))+'</b>.</div>';

  else body='<div class="note"><b>You already got your paycheck this week.</b><br>'+(p.next?'Next paycheck: <b>'+esc(dDay(p.next))+'</b>':'No more paychecks are scheduled.')+'</div>';

   (lp?'<div class="sub">Last paycheck picked up: '+esc(dShort(lp))+'</div>':'')+
   body+'</section>';
}

/* a weekly bill repeats every 7 days at 8:00 AM; each week becomes its own due bill (id "<assignment>:<week>") so it can be paid and go late on its own */
function expandAssign(list){
  var now=Date.now(), out=[];
  list.forEach(function(a){
    if(!a.recurring){var c=Object.assign({},a);c.startAt=bumpDay(a.startAt,a.classId);out.push(c);return;}
    for(var k=0;k<520;k++){
      var at=payAt(a.startAt,k,a.classId);
      if(at>now)break;
      out.push({id:a.id+":"+k,classId:a.classId,bill:a.bill,cents:a.cents,startAt:at,createdAt:a.createdAt});
    }
  });
  return out;
}
function lastBill(id){var m=0;S.tx.forEach(function(t){if(t.kind==="bill"&&t.meta&&t.meta.bill===id&&t.ts>m)m=t.ts;});return m;}
function dueFor(id){
  var now=Date.now(), paid={};
  S.tx.forEach(function(t){if(t.kind==="bill"&&t.meta&&t.meta.aid)paid[t.meta.aid]=1;});
  return S.assign.filter(function(a){return a.bill===id&&a.startAt<=now&&!paid[a.id];}).sort(function(a,b){return a.startAt-b.startAt;});
}
/* a bill is late 7 days after it starts; one late fee is added for each full week it stays unpaid */
function owed(a){
  var k=Math.max(0,Math.floor((Date.now()-a.startAt)/WEEK)), fee=S.lateFees[a.bill]||0;
  return {base:a.cents,weeks:k,late:k*fee,total:a.cents+k*fee};
}
function anyLate(){return ALLB.some(function(b){return dueFor(b[0]).some(function(a){return owed(a).weeks>0;});});}
function vBills(){
  var cards=ALLB.filter(function(b){return b!==OTHER&&(BILLS.indexOf(b)>-1||dueFor(b[0]).length>0);}).map(function(b){
    var due=dueFor(b[0]), lb=lastBill(b[0]), o=due.length?owed(due[0]):null, late=!!o&&o.weeks>0, note;
    if(o){
      note='Due since '+esc(dShort(due[0].startAt))+(due.length>1?' | '+(due.length-1)+' more due':'');
      if(late)note='Bill '+money(o.base)+' + late fees '+money(o.late)+'<br>'+note;

async function processInterest(){
  var s=S.student, anchor=s.interestAnchor; if(!anchor)return;
  var now=Date.now(), changed=false, guard=0;
  while(anchor+WEEK<=now&&guard++<104){
    var from=anchor,to=anchor+WEEK;
    var start=bal(S.tx,"savings",from), end=bal(S.tx,"savings",to);
    var interest=Math.round(start*RATE);
    if(interest>0){
      var t={sid:S.key,acct:"savings",amt:interest,kind:"interest",label:"Weekly interest (3%)",ts:to,meta:{from:from,to:to,start:start,moved:end-start,newBal:end+interest}};
      await store.addTx(t);S.tx.push(t);
    }
    anchor=to;changed=true;
  }
  if(changed){await store.updateStudent(S.key,{interestAnchor:anchor});s.interestAnchor=anchor;}
}
async function processFees(){
  S.feeNext=0;
  var cid=S.student.classId;if(!cid)return;
  var fees=await store.getSetting("fees"), rule=fees[cid];
  if(!rule||!rule.on)return;
  var cfg=await store.getSetting("feeAmounts");
  S.feeMin=cfg.minCents>0?cfg.minCents:FEE_MIN;S.feeAmt=cfg.feeCents>0?cfg.feeCents:FEE_AMT;
  var since=rule.since||0, now=Date.now();
  var list=S.tx.filter(function(t){return t.acct==="checking";}).sort(function(a,b){return a.ts-b.ts;});
  var have={};S.tx.forEach(function(t){if(t.kind==="fee"&&t.meta&&t.meta.due)have[t.meta.due]=1;});
  var b=0,active=null,spans=[];
  list.forEach(function(t){
    b+=t.amt;
    if(b<S.feeMin&&active===null)active=t.ts;
    else if(b>=S.feeMin&&active!==null){spans.push([active,t.ts]);active=null;}
  });
  if(active!==null)spans.push([active,Infinity]);
  var dues=[];
  spans.forEach(function(sp){
    var st=Math.max(sp[0],since);
    if(sp[1]<=st)return;
    for(var k=1;k<200;k++){
      var d=st+k*WEEK;
      if(d>=sp[1])break;
      if(d>now){if(sp[1]===Infinity)S.feeNext=d;break;}
      dues.push(d);
    }
  });
  for(var i=0;i<dues.length;i++){
    if(have[dues[i]])continue;
    var t={sid:S.key,acct:"checking",amt:-S.feeAmt,kind:"fee",label:"Minimum balance fee",ts:dues[i],meta:{due:dues[i]}};
    await store.addTx(t);S.tx.push(t);
  }
}
async function refresh(withInterest){
  S.tx=await store.getTx(S.key);
  S.classes=classesFrom(await store.getSetting("classes"));
  S.noClass=await store.getSetting("noClass");
  S.assign=expandAssign((await store.getAllAssignments()).filter(function(a){return a.sid?a.sid===S.key:(!!S.student.classId&&a.classId===S.student.classId);}));
  S.lateFees=await store.getSetting("lateFees");
  S.jobs=await store.getJobs(S.key);
  if(withInterest)await processInterest();
  await processFees();
}

    }).catch(function(){S.bkMsg="";S.bkErr="That file could not be opened.";go("tbackup");});
  }
  if(a==="bkcancel"){S.bkPending=null;S.bkErr="";S.bkMsg="";return go("tbackup");}
  if(a==="bkrestore"){
    var p=S.bkPending;if(!p)return;
    busy=true;
    return db.restoreFrom(p.snap).then(function(){S.bkPending=null;go("bkdone");}).catch(function(){
      S.bkMsg="";S.bkErr="The restore did not finish, so nothing was changed. Try again.";go("tbackup");
    }).then(function(){busy=false;});
  }
  if(a==="bkreload")return location.reload();
}
VIEWS.tbackup=vTBackup;VIEWS.bkdone=vBkDone;

/* ---------- start ---------- */
(async function init(){
  try{db=await LocalDB.open();}catch(e){db=null;}
  if(!db){seedMem();storeNote="Warning: this browser cannot save data. Nothing will be kept.";}
  else if(db.mode==="memory"){storeNote="Warning: this browser cannot save data. Do not use a private window.";}
  try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}
  go("start");
})();
})();
</script>
